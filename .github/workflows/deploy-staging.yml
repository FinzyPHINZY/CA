name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set output variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/core/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/acr-core:${{ steps.vars.outputs.sha_short }}
            ${{ env.DOCKERHUB_USERNAME }}/acr-core:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/auth_service/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/acr-auth-service:${{ steps.vars.outputs.sha_short }}
            ${{ env.DOCKERHUB_USERNAME }}/acr-auth-service:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/ai_service/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/acr-ai-service:${{ steps.vars.outputs.sha_short }}
            ${{ env.DOCKERHUB_USERNAME }}/acr-ai-service:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Notifications
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/notifications/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/acr-notifications:${{ steps.vars.outputs.sha_short }}
            ${{ env.DOCKERHUB_USERNAME }}/acr-notifications:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push File Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/file_service/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/acr-file-service:${{ steps.vars.outputs.sha_short }}
            ${{ env.DOCKERHUB_USERNAME }}/acr-file-service:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Script Parser
        uses: docker/build-push-action@v5
        with:
          context: apps/script_parser
          file: apps/script_parser/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/acr-script-parser:${{ steps.vars.outputs.sha_short }}
            ${{ env.DOCKERHUB_USERNAME }}/acr-script-parser:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Post build summary
        run: |
          echo "## Staging Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| acr-core | \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| acr-auth-service | \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| acr-ai-service | \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| acr-notifications | \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| acr-file-service | \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| acr-script-parser | \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Staging EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    env:
      EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
      EC2_USER: ${{ secrets.STAGING_EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.STAGING_EC2_SSH_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Slack - Staging Deployment Starting
        if: env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"[STAGING] Deploying CueActor Backend...\n- Commit: \`${{ github.sha }}\`\n- Branch: \`${{ github.ref_name }}\`\n- By: ${{ github.actor }}\"}" \
            ${{ env.SLACK_WEBHOOK }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Free disk space on EC2
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} bash << 'CLEANUP_SCRIPT'
            echo "Disk usage before cleanup:"
            df -h /
            cd ~/acr-backend
            docker-compose down 2>/dev/null || true
            docker system prune -af
            docker volume prune -f
            echo "Disk usage after cleanup:"
            df -h /
          CLEANUP_SCRIPT

      - name: Copy docker-compose to EC2
        run: |
          sed "s/\${DOCKERHUB_USERNAME}/${{ env.DOCKERHUB_USERNAME }}/g; s/:latest/:${{ env.IMAGE_TAG }}/g" \
            docker-compose.prod.dockerhub.yaml > docker-compose.deploy.yaml
          scp docker-compose.deploy.yaml ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:~/acr-backend/docker-compose.yaml

      - name: Run Database Migrations
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "mkdir -p ~/acr-backend/migrations"
          scp migrations/*.sql ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:~/acr-backend/migrations/
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} bash << 'MIGRATE_SCRIPT'
            set -e
            cd ~/acr-backend

            # Safely extract DB vars from .env (handles special characters)
            DB_HOST=$(grep -E '^DB_HOST=' .env | cut -d'=' -f2- | tr -d '\r')
            DB_PORT=$(grep -E '^DB_PORT=' .env | cut -d'=' -f2- | tr -d '\r')
            DB_USERNAME=$(grep -E '^DB_USERNAME=' .env | cut -d'=' -f2- | tr -d '\r')
            DB_PASSWORD=$(grep -E '^DB_PASSWORD=' .env | cut -d'=' -f2- | tr -d '\r')
            DB_NAME=$(grep -E '^DB_NAME=' .env | cut -d'=' -f2- | tr -d '\r')

            export PGPASSWORD=$DB_PASSWORD
            PSQL="psql -v ON_ERROR_STOP=1 -h $DB_HOST -p $DB_PORT -U $DB_USERNAME -d $DB_NAME"

            # Create tracking table if it doesn't exist
            $PSQL -c "
              CREATE TABLE IF NOT EXISTS migration_history (
                id SERIAL PRIMARY KEY,
                filename VARCHAR(255) UNIQUE NOT NULL,
                applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
            "

            MIGRATED=0

            # Run each migration file in order, skip if already applied
            for file in migrations/*.sql; do
              [ -f "$file" ] || continue
              filename=$(basename "$file")

              already_run=$($PSQL -t -c "SELECT COUNT(*) FROM migration_history WHERE filename = '$filename';" | xargs)

              if [ "$already_run" = "0" ]; then
                echo "Running migration: $filename"
                if $PSQL -f "$file"; then
                  $PSQL -c "INSERT INTO migration_history (filename) VALUES ('$filename');"
                  echo "Applied: $filename"
                  MIGRATED=$((MIGRATED + 1))
                else
                  echo "Migration failed: $filename"
                  exit 1
                fi
              else
                echo "Skipping (already applied): $filename"
              fi
            done

            echo "Migrations complete. $MIGRATED new migration(s) applied."
          MIGRATE_SCRIPT

      - name: Deploy with Rolling Restart
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} bash << 'DEPLOY_SCRIPT'
            set -e
            cd ~/acr-backend

            if [ ! -f .env ]; then
              echo "ERROR: .env file not found!"
              exit 1
            fi

            echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Pulling new images..."
            docker-compose pull

            SERVICES="rabbitmq redis core auth_service ai_service notifications file_service script_parser"

            for SERVICE in $SERVICES; do
              echo "Restarting $SERVICE..."
              docker-compose up -d --no-deps $SERVICE
              sleep 10

              if ! docker-compose ps | grep -E "$SERVICE.*Up"; then
                echo "ERROR: $SERVICE failed to start!"
                docker-compose logs --tail=50 $SERVICE
                exit 1
              fi
              echo "$SERVICE is running"
            done

            echo "All services restarted successfully"
          DEPLOY_SCRIPT

      - name: Health Check
        timeout-minutes: 5
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} bash << 'HEALTH_SCRIPT'
            set -e
            cd ~/acr-backend

            echo "Running health checks..."
            MAX_ATTEMPTS=12
            ATTEMPT=1

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."

              CORE_HEALTHY=false
              AUTH_HEALTHY=false

              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                CORE_HEALTHY=true
                echo "Core service healthy"
              fi

              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                AUTH_HEALTHY=true
                echo "Auth service healthy"
              fi

              if [ "$CORE_HEALTHY" = true ] && [ "$AUTH_HEALTHY" = true ]; then
                echo "All critical services are healthy!"
                docker-compose ps
                exit 0
              fi

              sleep 5
              ATTEMPT=$((ATTEMPT + 1))
            done

            echo "Health check failed after $MAX_ATTEMPTS attempts"
            docker-compose ps
            docker-compose logs --tail=30
            exit 1
          HEALTH_SCRIPT

      - name: Notify Slack - Success
        if: success() && env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"[STAGING] CueActor Backend deployed successfully!\n- Version: \`${{ env.IMAGE_TAG }}\`\n- Commit: \`${{ github.sha }}\`\"}" \
            ${{ env.SLACK_WEBHOOK }}

      - name: Notify Slack - Failure
        if: failure() && env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"[STAGING] CueActor Backend deployment FAILED!\n- Commit: \`${{ github.sha }}\`\n- Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            ${{ env.SLACK_WEBHOOK }}

      - name: Cleanup old images
        if: success()
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} 'docker image prune -f'
