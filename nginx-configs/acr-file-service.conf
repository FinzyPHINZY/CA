server {
    listen 80;
    server_name api.dev.file-service.cueactor.com;

    # Increase request size to 1GB for large file uploads
    client_max_body_size 1G;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # Proxy settings for file streaming
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Buffer settings for streaming
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://localhost:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Support for range requests (for streaming)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3004/health;
        access_log off;
    }
}

